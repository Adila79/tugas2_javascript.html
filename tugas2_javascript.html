<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas 2 - JavaScript</title>

    <style>
        table {
            border-collapse: collapse;
            width: 100%;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #ddd;
        }
    </style>
</head>

<body>

    <h2>Data Pegawai</h2>

    <table>
        <thead>
            <tr>
                <th>Nama Pegawai</th>
                <th>Umur</th>
                <th>Jabatan</th>
                <th>Status</th>
                <th>Gaji Pokok</th>
                <th>Tunjangan Jabatan</th>
                <th>BPJS</th>
                <th>Tunjangan Keluarga</th>
                <th>Total Gaji</th>
            </tr>
        </thead>

        <tbody id="dataPegawai">
        </tbody>

        <tfoot>
            <tr>
                <th colspan="8">Total Gaji</th>
                <th id="totalGaji"></th>
            </tr>
        </tfoot>
    </table>

    <script>
        let nama = "Dodi Prayodi";
        let umur = 25;
        let jabatan = "Manajer";
        let status = "Menikah";

        let gajiPokok;

        if (jabatan == "Manajer") {
            gajiPokok = 15000000;
        } else if (jabatan == "Asisten Manajer") {
            gajiPokok = 10000000;
        } else if (jabatan == "Staff") {
            gajiPokok = 5000000;
        }

        let tunjanganJabatan = 15 / 100 * gajiPokok;

        let bpjs = 10 / 100 * gajiPokok;

        let tunjanganKeluarga = status == "Menikah" ? 20 / 100 * gajiPokok : 0;

        let totalGaji = gajiPokok + tunjanganJabatan + bpjs + tunjanganKeluarga;

        document.getElementById("dataPegawai").innerHTML = `
            <tr>
                <td>${nama}</td>
                <td>${umur} tahun</td>
                <td>${jabatan}</td>
                <td>${status}</td>
                <td>Rp ${gajiPokok.toLocaleString("id-ID")}</td>
                <td>Rp ${tunjanganJabatan.toLocaleString("id-ID")}</td>
                <td>Rp ${bpjs.toLocaleString("id-ID")}</td>
                <td>Rp ${tunjanganKeluarga.toLocaleString("id-ID")}</td>
                <td>Rp ${totalGaji.toLocaleString("id-ID")}</td>
            </tr>
        `;

        document.getElementById("totalGaji").innerHTML =
            "Rp " + totalGaji.toLocaleString("id-ID");
    </script>

</body>
</html>
